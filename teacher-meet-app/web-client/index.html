<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TeacherMeet - Student</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
  :root {
    --bg: #202124;
    --panel: #2c2d31;
    --accent: #1a73e8;
    --danger: #d93025;
    --text: #e8eaed;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body { display: flex; flex-direction: column; }

  #joinScreen {
    margin: auto;
    background: var(--panel);
    padding: 24px;
    border-radius: 12px;
    width: 90%;
    max-width: 360px;
    text-align: center;
  }
  #joinScreen h1 { font-size: 20px; margin-bottom: 20px; }
  #joinScreen input, #joinScreen select {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #555;
    background: #1b1b1d;
    color: var(--text);
    font-size: 15px;
  }
  #joinScreen label { font-size: 12px; color: #aaa; display: block; margin-top: 10px; text-align: left; }
  button.primary {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  #callScreen { display: none; flex: 1; flex-direction: column; height: 100%; }
  #videoGrid {
    flex: 1;
    display: grid;
    gap: 6px;
    padding: 6px;
    grid-template-columns: 1fr;
    overflow-y: auto;
  }
  @media (min-width: 700px) {
    #videoGrid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  .tile {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 16/9;
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .label {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 12px;
    background: rgba(0,0,0,0.55);
    padding: 2px 8px;
    border-radius: 4px;
  }

  #controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
  }
  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: #3c4043;
    color: white;
    font-size: 20px;
    cursor: pointer;
  }
  .ctrl-btn.off { background: var(--danger); }
  .ctrl-btn.active { background: var(--accent); }
  #leaveBtn { background: var(--danger); width: auto; border-radius: 26px; padding: 0 22px; }

  /* focus mode: hide every tile except the teacher's, fill the screen */
  #videoGrid.focus-mode { grid-template-columns: 1fr; }
  #videoGrid.focus-mode .tile:not(.teacher-tile) { display: none; }
  #videoGrid.focus-mode .tile.teacher-tile { aspect-ratio: unset; height: 100%; }
  #videoGrid.focus-mode:not(:has(.teacher-tile))::after {
    content: "Waiting for the teacher to join…";
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #aaa;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  /* ---------- Raised-hand / screen-share badges on tiles ---------- */
  .hand-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 16px;
    background: rgba(0,0,0,0.55);
    border-radius: 50%;
    padding: 3px 5px;
    line-height: 1;
  }

  /* ---------- Chat / "ask a question" panel ---------- */
  #chatBadge {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    display: none;
  }
  #chatPanel {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    max-width: 88vw;
    height: 100%;
    background: var(--panel);
    border-left: 1px solid #444;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #chatPanel.open { transform: translateX(0); }
  #chatHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid #444;
    font-size: 14px;
  }
  #chatHeader button { background: none; border: none; color: var(--text); font-size: 16px; cursor: pointer; }
  #chatMessages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { max-width: 88%; padding: 8px 10px; border-radius: 10px; font-size: 13px; background: #3c4043; align-self: flex-start; word-wrap: break-word; }
  .chat-msg.self { align-self: flex-end; background: var(--accent); }
  .chat-msg .chat-sender { font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
  #chatInputRow { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #444; }
  #chatInputRow input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #1b1b1d; color: var(--text); font-size: 13px; }
  #chatInputRow button { padding: 8px 12px; border: none; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

  <div id="joinScreen">
    <h1>Join Class</h1>
    <input id="nameInput" placeholder="Your name" maxlength="60" />
    <input id="roomInput" placeholder="Room code from teacher" maxlength="60" />
    <label>Camera</label>
    <select id="singleCamera"></select>
    <button class="primary" id="joinBtn">Join call</button>
  </div>

  <div id="callScreen">
    <div id="videoGrid"></div>
    <div id="controls">
      <button class="ctrl-btn" id="micBtn" title="Mute/unmute">🎤</button>
      <button class="ctrl-btn" id="camBtn" title="Camera on/off">📷</button>
      <button class="ctrl-btn" id="focusBtn" title="Show only the teacher's video">▣</button>
      <button class="ctrl-btn" id="raiseHandBtn" title="Raise your hand">✋</button>
      <button class="ctrl-btn" id="screenBtn" title="Share your screen">🖥️</button>
      <button class="ctrl-btn" id="chatBtn" title="Ask the teacher a question">💬<span id="chatBadge"></span></button>
      <button id="leaveBtn" class="ctrl-btn">Leave</button>
    </div>
  </div>

  <div id="chatPanel">
    <div id="chatHeader">
      <span>Ask the teacher</span>
      <button id="chatCloseBtn">✕</button>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input id="chatInput" placeholder="Type your question…" maxlength="500" />
      <button id="chatSendBtn">Send</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
